<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Question - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-body">

<a href="{{ url_for('admin_questions') }}" class="back-btn fancy-back">
    <i class="fa-solid fa-arrow-left"></i> Back
</a>

<div class="form-container glass-form">

    <h2 class="form-title">➕ Add New Question</h2>

    <form method="POST">

        <div class="form-group">
            <label>Category</label>
            <select name="category_id" required>
                {% for c in categories %}
                <option value="{{ c.id }}">{{ c.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label>Difficulty</label>
            <select name="difficulty" required>
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
    
            </select>
        </div>

        <div class="form-group">
            <label>Level (optional)</label>
            <input type="number" name="level" placeholder="1, 2, 3 etc.">
        </div>

        <div class="form-group">
            <label>Question</label>
            <textarea name="question" required></textarea>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label>Option A</label>
                <input type="text" name="option_a" required>
            </div>

            <div class="form-group">
                <label>Option B</label>
                <input type="text" name="option_b" required>
            </div>

            <div class="form-group">
                <label>Option C</label>
                <input type="text" name="option_c" required>
            </div>

            <div class="form-group">
                <label>Option D</label>
                <input type="text" name="option_d" required>
            </div>
        </div>

        <div class="form-group">
            <label>Correct Option</label>
            <select name="correct" required>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
        </div>

        <button class="btn-primary big-btn" type="submit">
            <i class="fa-solid fa-plus"></i> Add Question
        </button>

    </form>
</div>

</body>
</html>
