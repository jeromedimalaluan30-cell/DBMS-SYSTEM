

<!-- admin/sidebar.html -->
<div class="admin-sidebar">
    <div class="admin-logo">⚡ Admin Panel</div>

    <div class="admin-nav">

        <a href="{{ url_for('admin_home') }}"
           class="{% if request.endpoint == 'admin_home' %}active{% endif %}">
            <i class="fa-solid fa-gauge"></i>
            <span>Dashboard</span>
        </a>

        <a href="{{ url_for('admin_questions') }}"
           class="{% if request.endpoint in [
                'admin_questions',
                'admin_add_question',
                'admin_edit_question'
           ] %}active{% endif %}">
            <i class="fa-solid fa-question"></i>
            <span>Manage Questions</span>
        </a>

        <a href="{{ url_for('admin_users') }}"
           class="{% if request.endpoint == 'admin_users' %}active{% endif %}">
            <i class="fa-solid fa-users"></i>
            <span>Manage Users</span>
        </a>

        <a href="{{ url_for('admin_leaderboard') }}"
           class="{% if request.endpoint == 'admin_leaderboard' %}active{% endif %}">
            <i class="fa-solid fa-trophy"></i>
            <span>Leaderboard</span>
        </a>

       
        

    </div>
     {% include 'admin/logout.html' %}
</div>
