<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Question - Admin</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="dashboard-body">

<a href="{{ url_for('admin_questions') }}" class="back-btn fancy-back">
    <i class="fa-solid fa-arrow-left"></i> Back
</a>

<div class="form-container glass-form">

    <h2 class="form-title">
        ✏️ Edit Question #{{ question.id }}
    </h2>

    <form method="POST">

        <!-- CATEGORY -->
        <div class="form-group">
            <label>Category</label>
            <select name="category_id" required>
                {% for c in categories %}
                <option value="{{ c.id }}"
                    {% if question.category_id == c.id %}selected{% endif %}>
                    {{ c.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- DIFFICULTY -->
        <div class="form-group">
            <label>Difficulty</label>
            <select name="difficulty" required>
                <option value="easy" {% if question.difficulty == 'easy' %}selected{% endif %}>Easy</option>
                <option value="medium" {% if question.difficulty == 'medium' %}selected{% endif %}>Medium</option>
                <option value="hard" {% if question.difficulty == 'hard' %}selected{% endif %}>Hard</option>
            </select>
        </div>

        <!-- LEVEL -->
        <div class="form-group">
            <label>Level (optional)</label>
            <input type="number" name="level" value="{{ question.level }}">
        </div>

        <!-- QUESTION -->
        <div class="form-group">
            <label>Question</label>
            <textarea name="question" required>{{ question.question }}</textarea>
        </div>

        <!-- OPTIONS -->
        <div class="form-grid">
            <div class="form-group">
                <label>Option A</label>
                <input type="text" name="option_a" value="{{ question.option_a }}" required>
            </div>

            <div class="form-group">
                <label>Option B</label>
                <input type="text" name="option_b" value="{{ question.option_b }}" required>
            </div>

            <div class="form-group">
                <label>Option C</label>
                <input type="text" name="option_c" value="{{ question.option_c }}" required>
            </div>

            <div class="form-group">
                <label>Option D</label>
                <input type="text" name="option_d" value="{{ question.option_d }}" required>
            </div>
        </div>

        <!-- CORRECT -->
        <div class="form-group">
            <label>Correct Option</label>
            <select name="correct" required>
                <option value="A" {% if question.correct_option=='A' %}selected{% endif %}>A</option>
                <option value="B" {% if question.correct_option=='B' %}selected{% endif %}>B</option>
                <option value="C" {% if question.correct_option=='C' %}selected{% endif %}>C</option>
                <option value="D" {% if question.correct_option=='D' %}selected{% endif %}>D</option>
            </select>
        </div>

        <!-- SUBMIT -->
        <button class="btn-primary big-btn" type="submit">
            <i class="fa-solid fa-save"></i> Save Changes
        </button>

    </form>

</div>

</body>
</html>
