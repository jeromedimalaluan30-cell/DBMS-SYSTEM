<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- SIDEBAR -->
<div class="admin-sidebar">
    <div class="admin-logo">⚡ Admin Panel</div>

    <div class="admin-nav">
        <a href="{{ url_for('admin_home') }}" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="{{ url_for('admin_questions') }}"><i class="fa-solid fa-question"></i> Manage Questions</a>
        <a href="{{ url_for('admin_users') }}"><i class="fa-solid fa-users"></i> Manage Users</a>
        <a href="{{ url_for('admin_leaderboard') }}"><i class="fa-solid fa-trophy"></i> Leaderboard</a>
        
    </div>
     {% include 'admin/logout.html' %}
</div>


   

<!-- MAIN CONTENT -->
<div class="admin-content">

    <h1 class="page-title">Welcome, Admin ⚙️</h1>

    <div class="admin-cards">

        <div class="admin-card">
            <i class="fa-solid fa-clipboard-question"></i>
            <h3>Manage Questions</h3>
        </div>

        <div class="admin-card">
            <i class="fa-solid fa-users"></i>
            <h3>View Users</h3>
        </div>

        <div class="admin-card">
            <i class="fa-solid fa-trophy"></i>
            <h3>Leaderboard</h3>
        </div>


    </div>

</div>

</body>
</html>
